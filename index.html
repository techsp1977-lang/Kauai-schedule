<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kauai Urgent Care - Provider Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>:root{--navy:#1B3A5C;--ocean:#2E86C1;--ocean-lt:#D6EAF8;--sand:#F7F4EF;--white:#fff;--ink:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--s:#1E8449;--d:#7D3C98;--l:#D35400;--sep:#2C3E50;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--ink);}
#login-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1.5rem;}
.login-box{background:var(--white);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#7EC8E3,#2E86C1);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;color:#fff;font-size:1.6rem;margin:0 auto 1.25rem;box-shadow:0 4px 14px rgba(46,134,193,.4);}
.login-title{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--navy);margin-bottom:.3rem;}
.login-sub{font-size:.8rem;color:var(--muted);margin-bottom:1.75rem;}
.login-input-wrap{position:relative;margin-bottom:1rem;}
.login-input{width:100%;padding:.75rem 2.75rem .75rem 1rem;border:2px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.95rem;color:var(--ink);outline:none;transition:border-color .2s;}
.login-input:focus{border-color:var(--ocean);}
.toggle-pw{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:.25rem;}
.login-btn{width:100%;padding:.8rem;background:var(--ocean);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:.25rem;}
.login-btn:hover{background:var(--navy);}
.login-btn:active{transform:scale(.98);}
.login-error{color:#DC2626;font-size:.8rem;margin-top:.75rem;display:none;}
.login-error.show{display:block;}
.login-footer{font-size:.7rem;color:var(--muted);margin-top:1.5rem;}
#app{display:none;}
header{background:var(--navy);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.hl{display:flex;align-items:center;gap:.6rem;}
.lm{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,#7EC8E3,#2E86C1);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;color:#fff;font-size:.95rem;flex-shrink:0;}
.lt{font-family:'DM Serif Display',serif;color:#fff;font-size:1rem;line-height:1.2;}
.ls{display:block;font-size:.6rem;font-weight:400;color:#93C5D6;letter-spacing:.08em;text-transform:uppercase;}
.hr{display:flex;align-items:center;gap:.5rem;}
.btn-t{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:.32rem .7rem;border-radius:5px;font-size:.74rem;font-weight:600;cursor:pointer;}
.btn-lo{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);padding:.32rem .7rem;border-radius:5px;font-size:.74rem;font-weight:600;cursor:pointer;}
.btn-lo:hover{background:rgba(255,255,255,.15);color:#fff;}
.yt{display:flex;background:rgba(255,255,255,.1);border-radius:7px;border:1px solid rgba(255,255,255,.2);overflow:hidden;}
.yb{padding:.3rem .6rem;font-size:.74rem;font-weight:600;color:rgba(255,255,255,.6);cursor:pointer;border:none;background:none;}
.yb.active{background:var(--ocean);color:#fff;}
.mn{background:var(--white);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:100;}
.mn::-webkit-scrollbar{display:none;}
.mt{display:flex;padding:0 .75rem;width:max-content;min-width:100%;}
.tab{padding:.6rem .85rem;font-size:.72rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;margin-bottom:-2px;}
.tab.active{color:var(--ocean);border-bottom-color:var(--ocean);font-weight:700;}
main{padding:1rem .75rem 4rem;max-width:1440px;margin:0 auto;}
.mp{display:none;}.mp.active{display:block;}
.mtitle{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--navy);margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem;}
.mtitle::after{content:'';flex:1;height:2px;background:linear-gradient(to right,var(--ocean-lt),transparent);}
.leg{display:flex;flex-wrap:wrap;gap:.35rem .85rem;padding:.7rem .85rem;background:var(--white);border-radius:8px;border:1px solid var(--border);margin-bottom:1rem;align-items:center;}
.leg-ttl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);width:100%;}
.li{display:flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:500;}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.1);flex-shrink:0;}
.lp{color:#fff;border-radius:3px;padding:1px 5px;font-size:.62rem;font-weight:600;}
.ld{width:1px;height:14px;background:var(--border);}
.un{font-size:.6rem;color:var(--muted);font-style:italic;width:100%;margin-top:.1rem;}
.wb{margin-bottom:1.25rem;background:var(--white);border-radius:10px;overflow:hidden;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.04);opacity:0;transform:translateY(8px);animation:fu .28s ease forwards;}
@keyframes fu{to{opacity:1;transform:translateY(0);}}
.wl{background:var(--sep);color:rgba(255,255,255,.88);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.28rem .8rem;display:block;}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.st{width:100%;border-collapse:collapse;font-size:.75rem;}
.dhr th{padding:.4rem .4rem;text-align:center;font-weight:600;font-size:.68rem;letter-spacing:.03em;border-right:1px solid rgba(255,255,255,.3);}
.dhr th:last-child{border-right:none;}
.thl{background:var(--s);color:#fff;text-align:left!important;font-size:.64rem;white-space:nowrap;width:240px;min-width:240px;}
.thw{background:var(--ocean-lt);color:var(--navy);min-width:72px;}
.thwe{background:#AED6F1;color:var(--navy);min-width:72px;}
.the{background:#f1f5f9;min-width:72px;}
.dr td{padding:.35rem .35rem;border-top:1px solid var(--border);border-right:1px solid var(--border);text-align:center;vertical-align:middle;}
.dr td:last-child{border-right:none;}
.tdl{text-align:left!important;font-weight:600;font-size:.64rem;color:#fff;line-height:1.3;white-space:nowrap;}
.tdl.shift{background:var(--s);}.tdl.derm{background:var(--d);}.tdl.lodging{background:var(--l);}
.cp{display:inline-block;width:100%;border-radius:4px;padding:.2rem .3rem;font-weight:600;font-size:.68rem;color:#1a1a2e;line-height:1.25;}
.cc{background:#4B5563!important;color:#fff!important;font-weight:700;}
@media(max-width:480px){.ls{display:none;}.lt{font-size:.9rem;}.yb{padding:.28rem .5rem;font-size:.68rem;}.thl{width:215px;min-width:215px;font-size:.58rem;}.thw,.thwe,.the{min-width:60px;}.cp{font-size:.62rem;padding:.15rem .25rem;}.st{font-size:.68rem;}}
@media(min-width:481px) and (max-width:767px){.thl{width:215px;min-width:215px;}.thw,.thwe,.the{min-width:66px;}}</style>
<style>@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}</style>
</head><body>
<div id="login-screen">
<div class="login-box">
<div class="login-logo">K</div>
<div class="login-title">Kauai Urgent Care</div>
<div class="login-sub">Provider Schedule &mdash; Authorized Staff Only</div>
<div class="login-input-wrap">
<input class="login-input" id="pwd-input" type="password" placeholder="Enter password" autocomplete="current-password">
<button class="toggle-pw" id="toggle-pw-btn" onclick="togglePw()" type="button">Show</button>
</div>
<button class="login-btn" onclick="doLogin()">Sign In</button>
<div class="login-error" id="login-error">Incorrect password. Please try again.</div>
<div class="login-footer">Kauai Urgent Care &bull; Staff Access Only</div>
</div></div>
<div id="app">
<header>
<div class="hl"><div class="lm">K</div><div class="lt">Kauai Urgent Care<span class="ls">Provider Schedule</span></div></div>
<div class="hr"><div class="yt" id="yTog"></div><button class="btn-t" onclick="gToday()">Today</button><button class="btn-lo" onclick="doLogout()">Sign Out</button></div>
</header>
<nav class="mn"><div class="mt" id="mTabs"></div></nav>
<main>
<div class="leg">
<div class="leg-ttl">Provider Color Key</div>
<div id="legKey" style="display:contents"></div>
<div class="ld"></div>
<div class="li"><span class="lp" style="background:#1E8449">Shift</span></div>
<div class="li"><span class="lp" style="background:#7D3C98">Derm</span></div>
<div class="li"><span class="lp" style="background:#D35400">Lodging</span></div>
<div class="un">Last updated: <span id="lastUpd">&hellip;</span></div>
</div>
<div id="cal"></div>
</main></div>
<script>var PWD_HASH='d98ddeb0ee0ae362ee3565c6214b212dc78fe590b92af4dc383b11922035a574';
var SESSION_KEY='kuc_auth';
async function hashPwd(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function doLogin(){
  var input=document.getElementById('pwd-input').value;
  if(!input){shake();return;}
  var hash=await hashPwd(input);
  if(hash===PWD_HASH){
    sessionStorage.setItem(SESSION_KEY,'1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    var err=document.getElementById('login-error');
    err.classList.add('show');
    document.getElementById('pwd-input').value='';
    shake();
    setTimeout(function(){err.classList.remove('show');},3000);
  }
}
function shake(){
  var box=document.querySelector('.login-box');
  box.style.animation='none';
  box.offsetHeight;
  box.style.animation='shake .4s ease';
}
function togglePw(){
  var inp=document.getElementById('pwd-input');
  var btn=document.getElementById('toggle-pw-btn');
  if(inp.type==='password'){inp.type='text';btn.textContent='Hide';}
  else{inp.type='password';btn.textContent='Show';}
}
function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd-input').value='';
}
document.getElementById('pwd-input').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
if(sessionStorage.getItem(SESSION_KEY)==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
}
var ALL_YEARS={};var YEARS=[];var DATA_READY=false,WANT_INIT=false;
// ---- Provider colors (edit here; the sheet script's colors are ignored) ----
var KEY_PROVIDERS=[['MILEKA','Mileka','#9A7400'],['KAITLYN','Kaitlyn','#1F5FA8'],['SABRINA','Sabrina','#1E7B45'],['ROVA','Rova','#6C3483'],['ADAMS','Adams','#B03A2E']];
var MID_PROVIDERS=[['PROCTOR','#F39C12'],['GRETCHEN','#C0D84A'],['TED','#22BEB6'],['BRYANT','#F48FB1'],['MORRIS','#8B5E3C'],['LOMBARDI','#D35FB7'],['HAYES','#A0A4A8'],['SCHENFELD','#C9B458']];
var PALETTE=['#FFBEC9','#FFC4AA','#E5D09D','#BFDAA8','#98E0C7','#85E0EB','#9BD9FF','#CACEFF','#F4C3EC','#DAD7D2'];
var NOT_PROVIDERS={DERM:1,XRAY:1,HOLD:1,END:1,HOME:1,APARTMENT:1,CLOSED:1,OTHER:1,COVERAGE:1};
var ALIASES={HAAS:'SABRINA',PROC:'PROCTOR',SUGARMAN:'SUGERMAN',JEPPESON:'JEPPESEN'};
var PCOLOR={};
function baseName(s){
  s=s.replace(/\(.*?\)/g,' ').replace(/\*/g,'').trim();
  if(!s||/^\d/.test(s))return null;
  var w=s.split(/\s+/)[0].toUpperCase().replace(/[^A-Z]/g,'');
  if(w.length<2||NOT_PROVIDERS[w])return null;
  return ALIASES[w]||w;
}
function pNames(v){
  if(!v||v.charAt(0)==='(')return [];
  return v.replace(/\bw\//gi,'/').split(/[\/|]/).map(baseName).filter(function(n){return n;});
}
function isLight(hex){var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);return (r*299+g*587+b*114)/1000>=150;}
function buildColors(){
  PCOLOR={};KEY_PROVIDERS.forEach(function(k){PCOLOR[k[0]]=k[2];});MID_PROVIDERS.forEach(function(k){PCOLOR[k[0]]=k[1];});
  var order=[],months={};
  YEARS.forEach(function(y){ALL_YEARS[y].forEach(function(m,mi){var mk=y+'|'+mi;
    m.weeks.forEach(function(w){w.rows.forEach(function(r){r.cells.forEach(function(c){
      pNames(c.value).forEach(function(n){if(!months[n]){months[n]={};order.push(n);}months[n][mk]=1;});
    });});});});});
  var fixed={};Object.keys(PCOLOR).forEach(function(k){fixed[k]=1;});
  var mates={};
  order.forEach(function(n){mates[n]=order.filter(function(o){return o!==n&&Object.keys(months[n]).some(function(mk){return months[o][mk];});});});
  function pick(n){var best=PALETTE[0],bestS=[-1,-1];
    PALETTE.forEach(function(c){var m=1e9,sum=0;mates[n].forEach(function(o){if(PCOLOR[o]){var d=cdist(c,PCOLOR[o]);m=Math.min(m,d);sum+=Math.min(d,90);}});
      if(m>bestS[0]||(m===bestS[0]&&sum>bestS[1])){bestS=[m,sum];best=c;}});
    PCOLOR[n]=best;}
  order.forEach(function(n){if(!fixed[n])pick(n);});
  for(var pass=0;pass<4;pass++)order.forEach(function(n){if(!fixed[n])pick(n);});
}
// how different two colors look: mostly color family (hue), partly light vs dark
function lch(h){var v=[1,3,5].map(function(i){var c=parseInt(h.substr(i,2),16)/255;return c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92;});
  var x=(v[0]*0.4124+v[1]*0.3576+v[2]*0.1805)/0.95047,y=v[0]*0.2126+v[1]*0.7152+v[2]*0.0722,z=(v[0]*0.0193+v[1]*0.1192+v[2]*0.9505)/1.08883;
  function f(t){return t>0.008856?Math.cbrt(t):7.787*t+16/116;}
  var L=116*f(y)-16,A=500*(f(x)-f(y)),B=200*(f(y)-f(z));
  return [L,Math.sqrt(A*A+B*B),(Math.atan2(B,A)*180/Math.PI+360)%360];}
function cdist(a,b){var p=lch(a),q=lch(b);
  if(p[1]<10&&q[1]<10)return Math.abs(p[0]-q[0]);
  if(p[1]<10||q[1]<10)return 60;
  var dh=Math.abs(p[2]-q[2]);dh=Math.min(dh,360-dh);
  var hue=dh*Math.min(1,Math.min(p[1],q[1])/40),lt=0.8*(p[0]-q[0]);
  return Math.sqrt(hue*hue+lt*lt);}
function cellStyle(v){
  var cols=[];pNames(v).forEach(function(n){if(PCOLOR[n]&&cols.indexOf(PCOLOR[n])===-1)cols.push(PCOLOR[n]);});
  if(!cols.length)return null;
  var light=cols.every(isLight);
  var txt=light?'color:#1a1a2e;':'color:#fff;'+(cols.some(isLight)?'text-shadow:0 0 3px rgba(0,0,0,.7);':'');
  if(cols.length===1)return 'background:'+cols[0]+';'+txt;
  var stops=cols.map(function(c,i){return c+' '+(i*100/cols.length)+'% '+((i+1)*100/cols.length)+'%';}).join(',');
  return 'background:linear-gradient(90deg,'+stops+');'+txt;
}
function renderLegend(){
  document.getElementById('legKey').innerHTML=KEY_PROVIDERS.map(function(k){return '<div class="li"><div class="sw" style="background:'+k[2]+'"></div>'+k[1]+'</div>';}).join('');
}
function isW(h){return h&&(h.indexOf('Sat')!==-1||h.indexOf('Sun')!==-1);}
function bWeek(week,wi){
  var h=week.headers;
  var nums=h.filter(function(x){return x&&/^\d/.test(x);});
  var lbl=nums.length?'Week of '+nums[0].split('-')[0]+'\u2013'+nums[nums.length-1].split('-')[0]:'Week';
  var t='<div class="wb" style="animation-delay:'+wi*0.05+'s">';
  t+='<span class="wl">'+lbl+'</span>';
  t+='<div class="tw"><table class="st"><thead><tr class="dhr">';
  t+='<th class="thl">Shifts</th>';
  for(var i=0;i<h.length;i++){var hdr=h[i];if(!hdr)t+='<th class="the"></th>';else if(isW(hdr))t+='<th class="thwe">'+hdr+'</th>';else t+='<th class="thw">'+hdr+'</th>';}
  t+='</tr></thead><tbody>';
  for(var ri=0;ri<week.rows.length;ri++){var row=week.rows[ri];
    t+='<tr class="dr"><td class="tdl '+row.type+'">'+row.label+'</td>';
    for(var ci=0;ci<h.length;ci++){var cell=row.cells[ci]||{value:'',color:null};
      if(!cell.value)t+='<td></td>';
      else if(cell.value.toLowerCase()==='closed')t+='<td><span class="cp cc">Closed</span></td>';
      else{var cs=cellStyle(cell.value);t+=cs?'<td><span class="cp" style="'+cs+'">'+cell.value+'</span></td>':'<td>'+cell.value+'</td>';}
    }t+='</tr>';
  }
  t+='</tbody></table></div></div>';return t;
}
function rMonth(m,mi){
  var w=m.weeks.map(function(wk,wi){return bWeek(wk,wi);}).join('');
  return '<div class="mp" id="mp'+mi+'"><h2 class="mtitle">'+m.name+'</h2>'+w+'</div>';
}
function rYear(year){
  document.querySelectorAll('.yb').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-year')===year);});
  var months=ALL_YEARS[year];
  document.getElementById('mTabs').innerHTML=months.map(function(m,i){return '<div class="tab" onclick="sMonth('+i+')">'+m.name+'</div>';}).join('');
  document.getElementById('cal').innerHTML=months.map(function(m,i){return rMonth(m,i);}).join('');
  sMonth(0);
}
function sMonth(idx){
  document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
  document.querySelectorAll('.mp').forEach(function(p,i){p.classList.toggle('active',i===idx);});
  var tab=document.querySelectorAll('.tab')[idx];
  if(tab)tab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  window.scrollTo({top:0,behavior:'smooth'});
}
function gToday(){
  var now=new Date();var y=String(now.getFullYear());
  var yr=ALL_YEARS[y]?y:YEARS[0];rYear(yr);
  var mn=now.toLocaleString('default',{month:'long'});
  var idx=-1;ALL_YEARS[yr].forEach(function(m,i){if(m.name===mn)idx=i;});
  if(idx>=0)sMonth(idx);
}
function init(){
  if(!DATA_READY){WANT_INIT=true;return;}
  buildColors();renderLegend();
  document.getElementById('yTog').innerHTML=YEARS.map(function(y){return '<button class="yb" data-year="'+y+'" onclick="rYear(\'' +y+ '\')">'+y+'</button>';}).join('');
  rYear('2026');
}
fetch('schedule.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
  var yrs=d.years||d;ALL_YEARS=yrs;if(d.lastUpdated)document.getElementById('lastUpd').textContent=d.lastUpdated+' HST';YEARS=Object.keys(ALL_YEARS).sort();DATA_READY=true;
  if(WANT_INIT||sessionStorage.getItem(SESSION_KEY)==='1')init();
}).catch(function(e){document.getElementById('cal').innerHTML='<p style="padding:1rem">Could not load schedule. Please refresh.</p>';});
</script>
</body></html>
