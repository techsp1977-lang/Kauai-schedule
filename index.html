<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kauai Urgent Care — Provider Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:       #1B3A5C;
    --ocean:      #2E86C1;
    --ocean-lt:   #D6EAF8;
    --sand:       #F7F4EF;
    --white:      #FFFFFF;
    --ink:        #1a1a2e;
    --muted:      #6b7280;
    --border:     #e5e7eb;
    --shift-lbl:  #1E8449;
    --derm-lbl:   #7D3C98;
    --lodge-lbl:  #D35400;
    --sep:        #2C3E50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "DM Sans", sans-serif; background: var(--sand); color: var(--ink); min-height: 100vh; }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; position: sticky; top: 0; z-index: 200;
    box-shadow: 0 2px 16px rgba(0,0,0,.3);
  }
  .header-left { display: flex; align-items: center; gap: .9rem; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, #7EC8E3, #2E86C1);
    display: flex; align-items: center; justify-content: center;
    font-family: "DM Serif Display", serif; color: #fff; font-size: 1.1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); flex-shrink: 0;
  }
  .logo-text { font-family: "DM Serif Display", serif; color: #fff; font-size: 1.15rem; line-height: 1.2; }
  .logo-text span { display: block; font-family: "DM Sans", sans-serif; font-size: .7rem; font-weight: 400; color: #93C5D6; letter-spacing: .08em; text-transform: uppercase; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: .75rem; }
  .btn-today {
    background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
    padding: .4rem .9rem; border-radius: 6px; font-family: "DM Sans", sans-serif;
    font-size: .78rem; font-weight: 600; cursor: pointer; letter-spacing: .03em;
    transition: background .2s;
  }
  .btn-today:hover { background: rgba(255,255,255,.22); }

  /* ── YEAR TOGGLE ── */
  .year-toggle {
    display: flex; background: rgba(255,255,255,.1); border-radius: 8px;
    border: 1px solid rgba(255,255,255,.2); overflow: hidden;
  }
  .year-btn {
    padding: .38rem .85rem; font-family: "DM Sans", sans-serif;
    font-size: .8rem; font-weight: 600; color: rgba(255,255,255,.65);
    cursor: pointer; border: none; background: none; transition: all .2s;
    letter-spacing: .02em;
  }
  .year-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
  .year-btn.active { background: var(--ocean); color: #fff; }

  /* ── MONTH NAV ── */
  .month-nav {
    background: var(--white); border-bottom: 2px solid var(--border);
    overflow-x: auto; scrollbar-width: none; position: sticky; top: 64px; z-index: 100;
  }
  .month-nav::-webkit-scrollbar { display: none; }
  .month-tabs { display: flex; padding: 0 1.5rem; width: max-content; min-width: 100%; }
  .month-tab {
    padding: .75rem 1.2rem; font-size: .8rem; font-weight: 500; color: var(--muted);
    cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s;
    white-space: nowrap; text-transform: uppercase; letter-spacing: .06em; margin-bottom: -2px;
  }
  .month-tab:hover { color: var(--ocean); }
  .month-tab.active { color: var(--ocean); border-bottom-color: var(--ocean); font-weight: 700; }

  /* ── MAIN ── */
  main { padding: 2rem 1.5rem 5rem; max-width: 1440px; margin: 0 auto; }
  .year-panel { display: none; }
  .year-panel.active { display: block; }
  .month-panel { display: none; }
  .month-panel.active { display: block; }

  .month-title {
    font-family: "DM Serif Display", serif; font-size: 2rem; color: var(--navy);
    margin-bottom: 1.25rem; display: flex; align-items: center; gap: .75rem;
  }
  .month-title::after { content: ""; flex: 1; height: 2px; background: linear-gradient(to right, var(--ocean-lt), transparent); border-radius: 2px; }

  /* ── LEGEND ── */
  .legend {
    display: flex; flex-wrap: wrap; gap: .5rem 1.25rem;
    padding: 1rem 1.25rem; background: var(--white); border-radius: 10px;
    border: 1px solid var(--border); margin-bottom: 1.5rem; align-items: center;
  }
  .legend-title { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); width: 100%; margin-bottom: .1rem; }
  .legend-item { display: flex; align-items: center; gap: .4rem; font-size: .76rem; font-weight: 500; }
  .legend-swatch { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(0,0,0,.1); flex-shrink: 0; }
  .legend-pill { color: #fff; border-radius: 3px; padding: 1px 7px; font-size: .68rem; font-weight: 600; }
  .legend-divider { width: 1px; height: 18px; background: var(--border); margin: 0 .15rem; }
  .legend-note { margin-left: auto; font-size: .7rem; color: var(--muted); font-style: italic; }

  /* ── WEEK BLOCK ── */
  .week-block {
    margin-bottom: 1.75rem; background: var(--white);
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
    opacity: 0; transform: translateY(10px);
    animation: fadeUp .3s ease forwards;
  }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  .week-label {
    background: var(--sep); color: rgba(255,255,255,.9);
    font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; padding: .3rem .9rem; display: block;
  }

  /* ── TABLE ── */
  .tbl-wrap { overflow-x: auto; }
  .schedule-table { width: 100%; border-collapse: collapse; font-size: .8rem; }

  .day-header-row th {
    padding: .5rem .55rem; text-align: center; font-weight: 600;
    font-size: .75rem; letter-spacing: .04em;
    border-right: 1px solid rgba(255,255,255,.35);
  }
  .day-header-row th:last-child { border-right: none; }
  .th-label { background: var(--shift-lbl); color: #fff; text-align: left !important; width: 180px; min-width: 155px; font-size: .7rem; }
  .th-weekday { background: var(--ocean-lt); color: var(--navy); min-width: 86px; }
  .th-weekend { background: #AED6F1; color: var(--navy); min-width: 86px; }
  .th-empty { background: #f1f5f9; min-width: 86px; }

  .data-row td {
    padding: .42rem .55rem; border-top: 1px solid var(--border);
    border-right: 1px solid var(--border); text-align: center;
    vertical-align: middle;
  }
  .data-row td:last-child { border-right: none; }
  .td-label { text-align: left !important; font-weight: 600; font-size: .7rem; color: #fff; line-height: 1.35; }
  .td-label.shift   { background: var(--shift-lbl); }
  .td-label.derm    { background: var(--derm-lbl); }
  .td-label.lodging { background: var(--lodge-lbl); }

  .cell-pill {
    display: inline-block; width: 100%; border-radius: 5px;
    padding: .28rem .45rem; font-weight: 600; font-size: .76rem;
    color: #1a1a2e; line-height: 1.3;
  }
  .cell-closed { background: #F1948A !important; color: #7B241C !important; font-weight: 700; }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    header { height: 56px; padding: 0 1rem; }
    .logo-text { display: none; }
    .year-btn { padding: .35rem .65rem; font-size: .75rem; }
    .month-tab { padding: .6rem .85rem; font-size: .73rem; }
    main { padding: 1rem .6rem 3rem; }
    .month-title { font-size: 1.35rem; }
    .th-label { width: 130px; min-width: 115px; }
    .th-weekday, .th-weekend, .th-empty { min-width: 68px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">K</div>
    <div class="logo-text">
      Kauai Urgent Care
      <span>Provider Schedule</span>
    </div>
  </div>
  <div class="header-right">
    <div class="year-toggle" id="yearToggle"></div>
    <button class="btn-today" onclick="jumpToToday()">&#9679; Today</button>
  </div>
</header>

<nav class="month-nav"><div class="month-tabs" id="monthTabs"></div></nav>

<main id="mainContent">
  <div class="legend">
    <div class="legend-title">Provider Color Key</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#AED6F1"></div>Kaitlyn</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#A9DFBF"></div>Haas</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#F9E79F"></div>Ashley</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#D2B4DE"></div>Rova</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#F1948A"></div>Adams</div>
    <div class="legend-divider"></div>
    <div class="legend-item"><span class="legend-pill" style="background:var(--shift-lbl)">Shift</span></div>
    <div class="legend-item"><span class="legend-pill" style="background:var(--derm-lbl)">Derm</span></div>
    <div class="legend-item"><span class="legend-pill" style="background:var(--lodge-lbl)">Lodging</span></div>
    <div class="legend-note">Visiting providers have unique colors per schedule</div>
  </div>
  <div id="calendarRoot"></div>
</main>

const YEARS = Object.keys(ALL_YEARS).sort();
let activeYear = null;
let activeMonthIdx = 0;

function isWeekend(h) { return h && (h.includes("Sat") || h.includes("Sun")); }

function buildWeekHTML(week, wi) {
  const h = week.headers;
  const dayNums = h.filter(x => x && /^\d/.test(x));
  const rangeLabel = dayNums.length
    ? "Week of " + dayNums[0].split("-")[0] + "\u2013" + dayNums[dayNums.length-1].split("-")[0]
    : "Week";

  let t = `<div class="week-block" style="animation-delay:${wi*0.055}s">`;
  t += `<span class="week-label">${rangeLabel}</span>`;
  t += `<div class="tbl-wrap"><table class="schedule-table"><thead><tr class="day-header-row">`;
  t += `<th class="th-label">Shifts&nbsp;*(Sat/Sun)</th>`;
  for (const hdr of h) {
    if (!hdr) t += `<th class="th-empty"></th>`;
    else if (isWeekend(hdr)) t += `<th class="th-weekend">${hdr}</th>`;
    else t += `<th class="th-weekday">${hdr}</th>`;
  }
  t += `</tr></thead><tbody>`;

  for (const row of week.rows) {
    t += `<tr class="data-row"><td class="td-label ${row.type}">${row.label}</td>`;
    for (let i = 0; i < h.length; i++) {
      const cell = row.cells[i] || {value:"",color:null};
      if (!cell.value) {
        t += `<td></td>`;
      } else if (cell.value.toLowerCase() === "closed") {
        t += `<td><span class="cell-pill cell-closed">Closed</span></td>`;
      } else if (cell.color) {
        t += `<td><span class="cell-pill" style="background:${cell.color}">${cell.value}</span></td>`;
      } else {
        t += `<td>${cell.value}</td>`;
      }
    }
    t += `</tr>`;
  }
  t += `</tbody></table></div></div>`;
  return t;
}

function renderMonthPanel(monthData, mi) {
  return `<div class="month-panel" id="mp-${mi}">
    <h2 class="month-title">${monthData.name}</h2>
    ${monthData.weeks.map((w,wi) => buildWeekHTML(w,wi)).join("")}
  </div>`;
}

function renderYear(year) {
  activeYear = year;
  const months = ALL_YEARS[year];

  // Year toggle buttons
  document.querySelectorAll(".year-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.year === year);
  });

  // Month tabs
  const tabsEl = document.getElementById("monthTabs");
  tabsEl.innerHTML = months.map((m,i) =>
    `<div class="month-tab" data-idx="${i}" onclick="switchMonth(${i})">${m.name}</div>`
  ).join("");

  // Calendar panels
  document.getElementById("calendarRoot").innerHTML =
    months.map((m,i) => renderMonthPanel(m,i)).join("");

  // Pick month — use current month only when viewing the current real-world year
  const now = new Date();
  const currentYear = String(now.getFullYear());
  let targetIdx = 0;
  if (year === currentYear) {
    const mName = now.toLocaleString("default",{month:"long"});
    const found = months.findIndex(m => m.name === mName);
    if (found >= 0) targetIdx = found;
  }
  // jumpToToday also respects this — 2026 opens January unless it IS the current year
  switchMonth(targetIdx);
}

function switchMonth(idx) {
  activeMonthIdx = idx;
  document.querySelectorAll(".month-tab").forEach((t,i) => t.classList.toggle("active", i===idx));
  document.querySelectorAll(".month-panel").forEach((p,i) => p.classList.toggle("active", i===idx));
  const tab = document.querySelectorAll(".month-tab")[idx];
  if (tab) tab.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  window.scrollTo({top:0,behavior:"smooth"});
}

function jumpToToday() {
  const now = new Date();
  const currentYear = String(now.getFullYear());
  if (ALL_YEARS[currentYear]) renderYear(currentYear);
  else renderYear(YEARS[0]);
}

function init() {
  // Build year toggle
  const toggleEl = document.getElementById("yearToggle");
  toggleEl.innerHTML = YEARS.map(y =>
    `<button class="year-btn" data-year="${y}" onclick="renderYear('${y}')">${y}</button>`
  ).join("");

  // Always default to 2026
  renderYear("2026");
}

init();
