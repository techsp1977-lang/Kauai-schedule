<style>:root{--navy:#1B3A5C;--ocean:#2E86C1;--ocean-lt:#D6EAF8;--sand:#F7F4EF;--white:#FFFFFF;--ink:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--shift-lbl:#1E8449;--derm-lbl:#7D3C98;--lodge-lbl:#D35400;--sep:#2C3E50;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;}
header{background:var(--navy);padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3);}
.hl{display:flex;align-items:center;gap:.75rem;}
.lm{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#7EC8E3,#2E86C1);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;color:#fff;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.25);flex-shrink:0;}
.lt{font-family:'DM Serif Display',serif;color:#fff;font-size:1.05rem;line-height:1.2;}
.ls{display:block;font-family:'DM Sans',sans-serif;font-size:.65rem;font-weight:400;color:#93C5D6;letter-spacing:.08em;text-transform:uppercase;}
.hr{display:flex;align-items:center;gap:.6rem;}
.btn-t{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:.38rem .8rem;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.yt{display:flex;background:rgba(255,255,255,.1);border-radius:8px;border:1px solid rgba(255,255,255,.2);overflow:hidden;}
.yb{padding:.35rem .7rem;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.65);cursor:pointer;border:none;background:none;}
.yb.active{background:var(--ocean);color:#fff;}
.mn{background:var(--white);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:100;}
.mn::-webkit-scrollbar{display:none;}
.mt{display:flex;padding:0 1rem;width:max-content;min-width:100%;}
.tab{padding:.7rem 1rem;font-size:.78rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;margin-bottom:-2px;}
.tab.active{color:var(--ocean);border-bottom-color:var(--ocean);font-weight:700;}
main{padding:1.25rem 1rem 5rem;max-width:1440px;margin:0 auto;}
.mp{display:none;}.mp.active{display:block;}
.mtitle{font-family:'DM Serif Display',serif;font-size:1.7rem;color:var(--navy);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;}
.mtitle::after{content:'';flex:1;height:2px;background:linear-gradient(to right,var(--ocean-lt),transparent);}
.leg{display:flex;flex-wrap:wrap;gap:.4rem 1rem;padding:.85rem 1rem;background:var(--white);border-radius:10px;border:1px solid var(--border);margin-bottom:1.25rem;align-items:center;}
.leg-ttl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);width:100%;}
.li{display:flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:500;}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.1);flex-shrink:0;}
.lp{color:#fff;border-radius:3px;padding:1px 6px;font-size:.66rem;font-weight:600;}
.ld{width:1px;height:16px;background:var(--border);}
.un{font-size:.65rem;color:var(--muted);font-style:italic;width:100%;margin-top:.1rem;}
.wb{margin-bottom:1.75rem;background:var(--white);border-radius:12px;overflow:hidden;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);opacity:0;transform:translateY(10px);animation:fu .3s ease forwards;}
@keyframes fu{to{opacity:1;transform:translateY(0);}}
.wl{background:var(--sep);color:rgba(255,255,255,.9);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.3rem .9rem;display:block;}
.tw{overflow-x:auto;}
.st{width:100%;border-collapse:collapse;font-size:.8rem;}
.dhr th{padding:.5rem .55rem;text-align:center;font-weight:600;font-size:.75rem;border-right:1px solid rgba(255,255,255,.35);}
.dhr th:last-child{border-right:none;}
.thl{background:var(--shift-lbl);color:#fff;text-align:left!important;width:180px;min-width:155px;font-size:.7rem;}
.thw{background:var(--ocean-lt);color:var(--navy);min-width:86px;}
.thwe{background:#AED6F1;color:var(--navy);min-width:86px;}
.the{background:#f1f5f9;min-width:86px;}
.dr td{padding:.42rem .55rem;border-top:1px solid var(--border);border-right:1px solid var(--border);text-align:center;vertical-align:middle;}
.dr td:last-child{border-right:none;}
.tdl{text-align:left!important;font-weight:600;font-size:.7rem;color:#fff;line-height:1.35;}
.tdl.shift{background:var(--shift-lbl);}.tdl.derm{background:var(--derm-lbl);}.tdl.lodging{background:var(--lodge-lbl);}
.cp{display:inline-block;width:100%;border-radius:5px;padding:.28rem .45rem;font-weight:600;font-size:.76rem;color:#1a1a2e;line-height:1.3;}
.cc{background:#F1948A!important;color:#7B241C!important;font-weight:700;}
.mw{display:none;}
@media(max-width:767px){
header{height:56px;}.ls{display:none;}
.yb{padding:.3rem .55rem;font-size:.7rem;}
.tab{padding:.6rem .8rem;font-size:.72rem;}
main{padding:1rem .75rem 5rem;}.mtitle{font-size:1.35rem;}
.wb{display:none;}
.mw{display:block;margin-bottom:.85rem;border-radius:10px;overflow:hidden;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.08);opacity:0;transform:translateY(8px);animation:fu .25s ease forwards;}
.mwh{display:flex;align-items:center;justify-content:space-between;background:var(--sep);padding:.8rem 1rem;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;min-height:52px;}
.mwh:active{opacity:.8;}
.mwhl{display:flex;flex-direction:column;gap:.2rem;}
.mwhr{font-size:1rem;font-weight:700;color:#fff;letter-spacing:.01em;}
.mwhd{font-size:.68rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;}
.mwhc{color:rgba(255,255,255,.8);font-size:1.1rem;transition:transform .22s;flex-shrink:0;margin-left:.75rem;}
.mw.open .mwhc{transform:rotate(180deg);}
.mwb{display:none;background:var(--white);}
.mw.open .mwb{display:block;}
.mwt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mwt{width:100%;border-collapse:collapse;font-size:.78rem;}
.mwt .rl{font-size:.65rem;font-weight:700;color:#fff;padding:.4rem .5rem;text-align:left;white-space:nowrap;min-width:80px;line-height:1.35;}
.mwt .rl.shift{background:var(--shift-lbl);}.mwt .rl.derm{background:var(--derm-lbl);}.mwt .rl.lodging{background:var(--lodge-lbl);}
.mwt .dh{background:var(--ocean-lt);color:var(--navy);font-size:.7rem;font-weight:700;padding:.4rem .4rem;text-align:center;min-width:56px;border-right:1px solid rgba(255,255,255,.4);}
.mwt .dh:last-child{border-right:none;}
.mwt .dh.wknd{background:#AED6F1;}
.mwt .dh.empty-h{background:#f1f5f9;min-width:56px;}
.mwt td{padding:.35rem .3rem;border-top:1px solid var(--border);border-right:1px solid var(--border);text-align:center;vertical-align:middle;min-width:56px;}
.mwt td:last-child{border-right:none;}
.mwt .cp{padding:.18rem .3rem;font-size:.7rem;border-radius:4px;}
.mwt .cc{font-size:.7rem;}
}</style>

var YEARS=Object.keys(ALL_YEARS).sort();
function isW(h){return h&&(h.indexOf('Sat')!==-1||h.indexOf('Sun')!==-1);}
function sLbl(label,type){
  if(type==='shift'){
    if(label.indexOf('8-noon')!==-1||label.indexOf('7-10')!==-1)return 'AM';
    if(label.indexOf('noon-4')!==-1||label.indexOf('10-3')!==-1)return 'Mid';
    if(label.indexOf('1-7')!==-1)return 'PM';
    return 'Shift';
  }
  if(type==='derm'){if(label.indexOf('Rova')!==-1)return 'Derm/Rova';return 'Derm/Other';}
  if(type==='lodging'){
    if(label.indexOf('Princeville')!==-1)return 'Apt-P';
    if(label.indexOf('Hanalei')!==-1)return 'Apt-H';
    return 'Home';
  }
  return label;
}
function bDesk(week,wi){
  var h=week.headers;
  var nums=h.filter(function(x){return x&&/^\d/.test(x);});
  var lbl=nums.length?'Week of '+nums[0].split('-')[0]+'\u2013'+nums[nums.length-1].split('-')[0]:'Week';
  var t='<div class="wb" style="animation-delay:'+wi*0.055+'s"><span class="wl">'+lbl+'</span><div class="tw"><table class="st"><thead><tr class="dhr"><th class="thl">Shifts&nbsp;*(Sat/Sun)</th>';
  for(var i=0;i<h.length;i++){var hdr=h[i];if(!hdr)t+='<th class="the"></th>';else if(isW(hdr))t+='<th class="thwe">'+hdr+'</th>';else t+='<th class="thw">'+hdr+'</th>';}
  t+='</tr></thead><tbody>';
  for(var ri=0;ri<week.rows.length;ri++){var row=week.rows[ri];t+='<tr class="dr"><td class="tdl '+row.type+'">'+row.label+'</td>';
    for(var ci=0;ci<h.length;ci++){var cell=row.cells[ci]||{value:'',color:null};
      if(!cell.value)t+='<td></td>';
      else if(cell.value.toLowerCase()==='closed')t+='<td><span class="cp cc">Closed</span></td>';
      else if(cell.color)t+='<td><span class="cp" style="background:'+cell.color+'">'+cell.value+'</span></td>';
      else t+='<td>'+cell.value+'</td>';}t+='</tr>';}
  t+='</tbody></table></div></div>';return t;
}
function bMob(week,wi){
  var h=week.headers;
  var nums=h.filter(function(x){return x&&/^\d/.test(x);});
  if(!nums.length)return '';
  var range='Week of '+nums[0].split('-')[0]+'\u2013'+nums[nums.length-1].split('-')[0];
  var dayStr=nums.map(function(d){return d.split('-').slice(1).join('');}).join('  ');
  var wid='mw'+wi;
  var t='<div class="mw" id="'+wid+'" style="animation-delay:'+(wi*0.07)+'s">';
  t+='<div class="mwh" onclick="tW(\'' +wid+ '\')">'; 
  t+='<div class="mwhl"><div class="mwhr">'+range+'</div><div class="mwhd">'+dayStr+'</div></div>';
  t+='<div class="mwhc">&#9660;</div></div>';
  t+='<div class="mwb"><div class="mwt-wrap"><table class="mwt"><thead><tr>';
  t+='<th class="rl" style="background:var(--sep);"></th>';
  for(var di=0;di<h.length;di++){var hdr=h[di];if(!hdr)t+='<th class="dh empty-h"></th>';else if(isW(hdr))t+='<th class="dh wknd">'+hdr+'</th>';else t+='<th class="dh">'+hdr+'</th>';}
  t+='</tr></thead><tbody>';
  for(var ri=0;ri<week.rows.length;ri++){
    var row=week.rows[ri];
    t+='<tr><td class="rl '+row.type+'">'+sLbl(row.label,row.type)+'</td>';
    for(var ci=0;ci<h.length;ci++){
      var cell=row.cells[ci]||{value:'',color:null};
      if(!cell.value)t+='<td></td>';
      else if(cell.value.toLowerCase()==='closed')t+='<td><span class="cp cc">Closed</span></td>';
      else if(cell.color)t+='<td><span class="cp" style="background:'+cell.color+'">'+cell.value+'</span></td>';
      else t+='<td>'+cell.value+'</td>';
    }
    t+='</tr>';
  }
  t+='</tbody></table></div></div></div>';return t;
}
function tW(id){var el=document.getElementById(id);if(el)el.classList.toggle('open');}
function rMonth(m,mi){
  var w=m.weeks.map(function(wk,wi){return bDesk(wk,wi)+bMob(wk,wi);}).join('');
  return '<div class="mp" id="mp'+mi+'"><h2 class="mtitle">'+m.name+'</h2>'+w+'</div>';
}
function rYear(year){
  document.querySelectorAll('.yb').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-year')===year);});
  var months=ALL_YEARS[year];
  document.getElementById('mTabs').innerHTML=months.map(function(m,i){return '<div class="tab" onclick="sMonth('+i+')">'+m.name+'</div>';}).join('');
  document.getElementById('cal').innerHTML=months.map(function(m,i){return rMonth(m,i);}).join('');
  sMonth(0);
}
function sMonth(idx){
  document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
  document.querySelectorAll('.mp').forEach(function(p,i){p.classList.toggle('active',i===idx);});
  var tab=document.querySelectorAll('.tab')[idx];
  if(tab)tab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  window.scrollTo({top:0,behavior:'smooth'});
}
function gToday(){
  var now=new Date();var y=String(now.getFullYear());
  var yr=ALL_YEARS[y]?y:YEARS[0];rYear(yr);
  var mn=now.toLocaleString('default',{month:'long'});
  var idx=-1;ALL_YEARS[yr].forEach(function(m,i){if(m.name===mn)idx=i;});
  if(idx>=0)sMonth(idx);
}
function init(){
  document.getElementById('yTog').innerHTML=YEARS.map(function(y){return '<button class="yb" data-year="'+y+'" onclick="rYear(\'' +y+ '\')">'+y+'</button>';}).join('');
  rYear('2026');
}
init();</script>
