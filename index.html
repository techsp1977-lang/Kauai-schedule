<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kauai Urgent Care ? Provider Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1B3A5C; --ocean:#2E86C1; --ocean-lt:#D6EAF8;
    --sand:#F7F4EF; --white:#FFFFFF; --ink:#1a1a2e; --muted:#6b7280;
    --border:#e5e7eb; --shift-lbl:#1E8449; --derm-lbl:#7D3C98;
    --lodge-lbl:#D35400; --sep:#2C3E50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "DM Sans", sans-serif; background: var(--sand); color: var(--ink); min-height: 100vh; }

  /* ?? HEADER ?? */
  header { background: var(--navy); padding: 0 1.25rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 16px rgba(0,0,0,.3); }
  .header-left { display: flex; align-items: center; gap: .75rem; }
  .logo-mark { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg,#7EC8E3,#2E86C1); display: flex; align-items: center; justify-content: center; font-family: "DM Serif Display",serif; color: #fff; font-size: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.25); flex-shrink: 0; }
  .logo-text { font-family: "DM Serif Display",serif; color: #fff; font-size: 1.05rem; line-height: 1.2; }
  .logo-text span { display: block; font-family: "DM Sans",sans-serif; font-size: .65rem; font-weight: 400; color: #93C5D6; letter-spacing: .08em; text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: .6rem; }
  .btn-today { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); padding: .38rem .8rem; border-radius: 6px; font-family: "DM Sans",sans-serif; font-size: .78rem; font-weight: 600; cursor: pointer; transition: background .2s; white-space: nowrap; }
  .btn-today:hover { background: rgba(255,255,255,.22); }
  .year-toggle { display: flex; background: rgba(255,255,255,.1); border-radius: 8px; border: 1px solid rgba(255,255,255,.2); overflow: hidden; }
  .year-btn { padding: .35rem .7rem; font-family: "DM Sans",sans-serif; font-size: .78rem; font-weight: 600; color: rgba(255,255,255,.65); cursor: pointer; border: none; background: none; transition: all .2s; }
  .year-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
  .year-btn.active { background: var(--ocean); color: #fff; }

  /* ?? MONTH NAV ?? */
  .month-nav { background: var(--white); border-bottom: 2px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 60px; z-index: 100; }
  .month-nav::-webkit-scrollbar { display: none; }
  .month-tabs { display: flex; padding: 0 1rem; width: max-content; min-width: 100%; }
  .month-tab { padding: .7rem 1rem; font-size: .78rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s; white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; margin-bottom: -2px; }
  .month-tab:hover { color: var(--ocean); }
  .month-tab.active { color: var(--ocean); border-bottom-color: var(--ocean); font-weight: 700; }

  /* ?? MAIN ?? */
  main { padding: 1.25rem 1rem 5rem; max-width: 1440px; margin: 0 auto; }
  .month-panel { display: none; }
  .month-panel.active { display: block; }
  .month-title { font-family: "DM Serif Display",serif; font-size: 1.7rem; color: var(--navy); margin-bottom: 1rem; display: flex; align-items: center; gap: .6rem; }
  .month-title::after { content: ""; flex: 1; height: 2px; background: linear-gradient(to right,var(--ocean-lt),transparent); border-radius: 2px; }

  /* ?? LEGEND ?? */
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; padding: .85rem 1rem; background: var(--white); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 1.25rem; align-items: center; }
  .legend-title { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); width: 100%; margin-bottom: .1rem; }
  .legend-item { display: flex; align-items: center; gap: .35rem; font-size: .74rem; font-weight: 500; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.1); flex-shrink: 0; }
  .legend-pill { color: #fff; border-radius: 3px; padding: 1px 6px; font-size: .66rem; font-weight: 600; }
  .legend-divider { width: 1px; height: 16px; background: var(--border); }
  .updated-note { font-size: .65rem; color: var(--muted); font-style: italic; width: 100%; margin-top: .1rem; }

  /* ????????????????????????????????
     DESKTOP TABLE (? 768px)
  ???????????????????????????????? */
  .week-block { margin-bottom: 1.75rem; background: var(--white); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04); opacity: 0; transform: translateY(10px); animation: fadeUp .3s ease forwards; }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  .week-label { background: var(--sep); color: rgba(255,255,255,.9); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: .3rem .9rem; display: block; }
  .tbl-wrap { overflow-x: auto; }
  .schedule-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .day-header-row th { padding: .5rem .55rem; text-align: center; font-weight: 600; font-size: .75rem; letter-spacing: .04em; border-right: 1px solid rgba(255,255,255,.35); }
  .day-header-row th:last-child { border-right: none; }
  .th-label { background: var(--shift-lbl); color: #fff; text-align: left !important; width: 180px; min-width: 155px; font-size: .7rem; }
  .th-weekday { background: var(--ocean-lt); color: var(--navy); min-width: 86px; }
  .th-weekend { background: #AED6F1; color: var(--navy); min-width: 86px; }
  .th-empty { background: #f1f5f9; min-width: 86px; }
  .data-row td { padding: .42rem .55rem; border-top: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; vertical-align: middle; }
  .data-row td:last-child { border-right: none; }
  .td-label { text-align: left !important; font-weight: 600; font-size: .7rem; color: #fff; line-height: 1.35; }
  .td-label.shift { background: var(--shift-lbl); }
  .td-label.derm  { background: var(--derm-lbl); }
  .td-label.lodging { background: var(--lodge-lbl); }
  .cell-pill { display: inline-block; width: 100%; border-radius: 5px; padding: .28rem .45rem; font-weight: 600; font-size: .76rem; color: #1a1a2e; line-height: 1.3; }
  .cell-closed { background: #F1948A !important; color: #7B241C !important; font-weight: 700; }
  .mobile-week { display: none; }

  /* ????????????????????????????????
     MOBILE CARD VIEW (< 768px)
  ???????????????????????????????? */
  @media (max-width: 767px) {
    header { height: 56px; }
    .logo-text span { display: none; }
    .year-btn { padding: .3rem .55rem; font-size: .7rem; }
    .month-tab { padding: .6rem .8rem; font-size: .72rem; }
    main { padding: 1rem .75rem 5rem; }
    .month-title { font-size: 1.35rem; }

    .week-block { display: none; }
    .mobile-week { display: block; margin-bottom: 1rem; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04); opacity: 0; transform: translateY(10px); animation: fadeUp .3s ease forwards; }

    /* ?? Week accordion header ?? */
    .week-accordion-header {
      background: var(--sep);
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .week-accordion-header:active { opacity: .85; }
    .wah-left { display: flex; flex-direction: column; gap: .15rem; }
    .wah-range { font-size: .95rem; font-weight: 700; color: #fff; letter-spacing: .01em; }
    .wah-days  { font-size: .7rem; color: rgba(255,255,255,.6); letter-spacing: .05em; text-transform: uppercase; }
    .wah-right { display: flex; align-items: center; gap: .5rem; }
    .wah-dots  { display: flex; gap: .25rem; flex-wrap: wrap; max-width: 80px; justify-content: flex-end; }
    .wah-dot   { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .wah-chevron { color: rgba(255,255,255,.7); font-size: 1rem; transition: transform .25s; flex-shrink: 0; }
    .mobile-week.open .wah-chevron { transform: rotate(180deg); }

    /* ?? Week body ?? */
    .week-body { display: none; background: var(--white); }
    .mobile-week.open .week-body { display: block; }

    /* ?? Day section inside week ?? */
    .mobile-day { border-bottom: 1px solid var(--border); }
    .mobile-day:last-child { border-bottom: none; }

    .mobile-day-header {
      display: flex; align-items: center; gap: .75rem;
      padding: .65rem 1rem;
      background: var(--white);
    }
    .mobile-day-header.weekend { background: #F0F7FF; }
    .day-num-badge {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--ocean-lt); color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; flex-shrink: 0;
    }
    .mobile-day-header.weekend .day-num-badge { background: var(--ocean); color: #fff; }
    .day-name-text { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    /* ?? Schedule rows inside each day ?? */
    .day-rows { padding: .25rem .75rem .6rem 1rem; }
    .day-row { display: flex; align-items: flex-start; gap: .5rem; padding: .35rem 0; border-bottom: 1px solid var(--border); }
    .day-row:last-child { border-bottom: none; }
    .row-type-badge { font-size: .65rem; font-weight: 700; color: #fff; padding: .2rem .45rem; border-radius: 4px; white-space: nowrap; flex-shrink: 0; min-width: 62px; text-align: center; line-height: 1.5; margin-top: 1px; }
    .row-type-badge.shift   { background: var(--shift-lbl); }
    .row-type-badge.derm    { background: var(--derm-lbl); }
    .row-type-badge.lodging { background: var(--lodge-lbl); }
    .row-value { font-size: .82rem; flex: 1; }
    .rv-pill { display: inline-block; padding: .2rem .5rem; border-radius: 5px; font-weight: 600; color: #1a1a2e; line-height: 1.3; }
    .rv-empty { color: #C4C9D4; font-style: italic; font-size: .76rem; }
    .rv-closed { background: #F1948A; color: #7B241C; font-weight: 700; border-radius: 5px; padding: .2rem .5rem; font-size: .8rem; }
  }
</style>
</head>

const YEARS = Object.keys(ALL_YEARS).sort();
function isWeekend(h) { return h && (h.includes("Sat") || h.includes("Sun")); }

// ?? SHORT ROW LABELS FOR MOBILE ??????????????????????????????
function shortLabel(label, type) {
  if (type === "shift") {
    if (label.includes("8-noon") || label.includes("7-10")) return "AM Shift";
    if (label.includes("noon-4") || label.includes("10-3")) return "Mid Shift";
    if (label.includes("1-7"))  return "PM Shift";
    return "Shift";
  }
  if (type === "derm") return label.replace("Derm | ","Derm ").replace("Derm | ","");
  if (type === "lodging") {
    if (label.includes("Princeville")) return "Apt (P-ville)";
    if (label.includes("Hanalei"))     return "Apt (Hanalei)";
    return "Home";
  }
  return label;
}

// ?? DESKTOP TABLE ????????????????????????????????????????????
function buildDesktopWeek(week, wi) {
  const h = week.headers;
  const nums = h.filter(x => x && /^d/.test(x));
  const lbl = nums.length ? "Week of " + nums[0].split("-")[0] + "?" + nums[nums.length-1].split("-")[0] : "Week";
  let t = `<div class="week-block" style="animation-delay:${wi*0.055}s">
    <span class="week-label">${lbl}</span>
    <div class="tbl-wrap"><table class="schedule-table">
    <thead><tr class="day-header-row">
    <th class="th-label">Shifts&nbsp;*(Sat/Sun)</th>`;
  for (const hdr of h) {
    if (!hdr) t += `<th class="th-empty"></th>`;
    else if (isWeekend(hdr)) t += `<th class="th-weekend">${hdr}</th>`;
    else t += `<th class="th-weekday">${hdr}</th>`;
  }
  t += `</tr></thead><tbody>`;
  for (const row of week.rows) {
    t += `<tr class="data-row"><td class="td-label ${row.type}">${row.label}</td>`;
    for (let i = 0; i < h.length; i++) {
      const cell = row.cells[i] || {value:"",color:null};
      if (!cell.value) t += `<td></td>`;
      else if (cell.value.toLowerCase() === "closed") t += `<td><span class="cell-pill cell-closed">Closed</span></td>`;
      else if (cell.color) t += `<td><span class="cell-pill" style="background:${cell.color}">${cell.value}</span></td>`;
      else t += `<td>${cell.value}</td>`;
    }
    t += `</tr>`;
  }
  t += `</tbody></table></div></div>`;
  return t;
}

// ?? MOBILE WEEK ACCORDION ????????????????????????????????????
function buildMobileWeek(week, wi) {
  const h = week.headers;
  const validDays = h.filter(x => x && /^d/.test(x));
  if (!validDays.length) return "";

  const first = validDays[0].split("-")[0];
  const last  = validDays[validDays.length-1].split("-")[0];
  const weekRange = "Week of " + first + "?" + last;
  const dayNames  = validDays.map(d => d.split("-").slice(1).join("-")).join(" ? ");

  // Collect all filled provider dots for preview
  const allFilled = [];
  week.rows.forEach(row => {
    row.cells.forEach(c => {
      if (c && c.value && c.color && c.value.toLowerCase() !== "closed") {
        if (!allFilled.find(x => x.color === c.color)) allFilled.push(c);
      }
    });
  });
  const dotsHTML = allFilled.slice(0,8).map(c =>
    `<div class="wah-dot" style="background:${c.color}"></div>`
  ).join("");

  let t = `<div class="mobile-week" id="mw-${wi}" style="animation-delay:${wi*0.07}s">
    <div class="week-accordion-header" onclick="toggleWeek('mw-${wi}')">
      <div class="wah-left">
        <div class="wah-range">${weekRange}</div>
        <div class="wah-days">${dayNames}</div>
      </div>
      <div class="wah-right">
        <div class="wah-dots">${dotsHTML}</div>
        <div class="wah-chevron">&#9660;</div>
      </div>
    </div>
    <div class="week-body">`;

  // One section per day
  for (let di = 0; di < h.length; di++) {
    const hdr = h[di];
    if (!hdr) continue;
    const parts   = hdr.split("-");
    const dayNum  = parts[0];
    const dayName = parts.slice(1).join("-");
    const wknd    = isWeekend(hdr);

    t += `<div class="mobile-day">
      <div class="mobile-day-header${wknd ? " weekend" : ""}">
        <div class="day-num-badge">${dayNum}</div>
        <div class="day-name-text">${dayName}</div>
      </div>
      <div class="day-rows">`;

    for (const row of week.rows) {
      const cell = row.cells[di] || { value: "", color: null };
      let valHTML = "";
      if (!cell.value) {
        valHTML = `<span class="rv-empty">?</span>`;
      } else if (cell.value.toLowerCase() === "closed") {
        valHTML = `<span class="rv-closed">Closed</span>`;
      } else if (cell.color) {
        valHTML = `<span class="rv-pill" style="background:${cell.color}">${cell.value}</span>`;
      } else {
        valHTML = `<span>${cell.value}</span>`;
      }

      t += `<div class="day-row">
        <div class="row-type-badge ${row.type}">${shortLabel(row.label, row.type)}</div>
        <div class="row-value">${valHTML}</div>
      </div>`;
    }

    t += `</div></div>`; // close day-rows, mobile-day
  }

  t += `</div></div>`; // close week-body, mobile-week
  return t;
}

function toggleWeek(id) {
  document.getElementById(id).classList.toggle("open");
}

// ?? RENDER ???????????????????????????????????????????????????
function renderMonthPanel(monthData, mi) {
  const weeks = monthData.weeks.map((w, wi) =>
    buildDesktopWeek(w, wi) + buildMobileWeek(w, wi)
  ).join("");
  return `<div class="month-panel" id="mp-${mi}">
    <h2 class="month-title">${monthData.name}</h2>
    ${weeks}
  </div>`;
}

function renderYear(year) {
  document.querySelectorAll(".year-btn").forEach(b => b.classList.toggle("active", b.dataset.year === year));
  const months = ALL_YEARS[year];
  document.getElementById("monthTabs").innerHTML = months.map((m,i) =>
    `<div class="month-tab" onclick="switchMonth(${i})">${m.name}</div>`
  ).join("");
  document.getElementById("calendarRoot").innerHTML = months.map((m,i) => renderMonthPanel(m,i)).join("");
  switchMonth(0);
}

function switchMonth(idx) {
  document.querySelectorAll(".month-tab").forEach((t,i) => t.classList.toggle("active", i===idx));
  document.querySelectorAll(".month-panel").forEach((p,i) => p.classList.toggle("active", i===idx));
  const tab = document.querySelectorAll(".month-tab")[idx];
  if (tab) tab.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
  window.scrollTo({top:0, behavior:"smooth"});
}

function jumpToToday() {
  const now = new Date();
  const y = String(now.getFullYear());
  const year = ALL_YEARS[y] ? y : YEARS[0];
  renderYear(year);
  const mName = now.toLocaleString("default",{month:"long"});
  const idx = ALL_YEARS[year].findIndex(m => m.name === mName);
  if (idx >= 0) switchMonth(idx);
}

function init() {
  document.getElementById("yearToggle").innerHTML = YEARS.map(y =>
    `<button class="year-btn" data-year="${y}" onclick="renderYear('${y}')">${y}</button>`
  ).join("");
  renderYear("2026");
}

init();
