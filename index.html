<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Kauai Urgent Care - Provider Schedule</title>
<style>
:root{color-scheme:light dark;
--tint:rgb(0 122 255);--tint-text:rgb(0 102 204);--on-tint:#fff;--red:rgb(215 0 21);
--label:rgb(0 0 0);--label2:rgb(60 60 67/.72);
--sep:rgb(60 60 67/.18);--bg:rgb(242 242 247);--card:rgb(255 255 255);--card2:rgb(248 248 250);
--fill:rgb(118 118 128/.12);--fill2:rgb(118 118 128/.08);--thumb:#fff;
--glass:rgb(242 242 247/.86);--glass-edge:rgb(0 0 0/.08);
--s:#248A3D;--d:#8944AB;--l:#C93400;--closed-bg:#EEF0F2;--closed:#B91C1C;
--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--r-card:14px;--r-ctl:10px;--margin:16px;}
@media (prefers-color-scheme:dark){:root{
--tint:rgb(10 132 255);--tint-text:rgb(64 156 255);--red:rgb(255 69 58);
--label:#fff;--label2:rgb(235 235 245/.64);
--sep:rgb(84 84 88/.6);--bg:#000;--card:rgb(28 28 30);--card2:rgb(36 36 38);
--fill:rgb(118 118 128/.24);--fill2:rgb(118 118 128/.18);--thumb:rgb(99 99 102);
--glass:rgb(22 22 24/.84);--glass-edge:rgb(255 255 255/.08);
--s:#30D158;--d:#BF5AF2;--l:#FF9F0A;--closed-bg:#3A2A2C;--closed:#FF8A80;}}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--label);font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;color:inherit;}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 45%,transparent);border-radius:8px;}

/* ---- sign in ---- */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:var(--margin);}
.login-box{background:var(--card);border-radius:22px;padding:32px 24px 24px;width:100%;max-width:360px;text-align:center;}
.login-logo{width:56px;height:56px;border-radius:13px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;margin:0 auto 16px;}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px;}
.login-sub{font-size:15px;color:var(--label2);margin-bottom:24px;}
.login-input-wrap{position:relative;margin-bottom:12px;}
.login-input{width:100%;height:44px;padding:0 64px 0 14px;border:none;border-radius:var(--r-ctl);background:var(--fill);font-family:inherit;font-size:17px;color:var(--label);outline:none;}
.login-input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 45%,transparent);}
.toggle-pw{position:absolute;right:0;top:0;height:44px;min-width:60px;background:none;border:none;cursor:pointer;color:var(--tint-text);font-size:15px;}
.login-btn{width:100%;height:50px;background:var(--tint);color:var(--on-tint);border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s;}
.login-btn:active{transform:scale(.98);filter:brightness(.92);}
.login-error{color:var(--red);font-size:13px;margin-top:12px;display:none;}
.login-error.show{display:block;}
.login-footer{font-size:12px;color:var(--label2);margin-top:20px;}

/* ---- top bar: glass, because the schedule scrolls under it ---- */
#app{display:none;}
.topbar{position:sticky;top:0;z-index:200;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--glass-edge);padding-top:env(safe-area-inset-top);}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.topbar{background:var(--bg);}}
header{display:flex;align-items:center;gap:12px;padding:8px max(var(--margin),env(safe-area-inset-left));max-width:1440px;margin:0 auto;}
.hl{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.lm{width:32px;height:32px;border-radius:8px;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0;}
.lt{font-size:17px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ls{display:block;font-size:12px;font-weight:400;color:var(--label2);letter-spacing:0;}
.hr{display:flex;align-items:center;gap:8px;}
.hb{display:flex;gap:8px;}
.btn-t,.btn-lo{height:34px;padding:0 14px;border-radius:999px;border:none;background:var(--fill);font-size:15px;font-weight:600;cursor:pointer;position:relative;transition:transform .15s;}
.btn-t{color:var(--tint-text);}
.btn-lo{color:var(--label);}
.btn-t::after,.btn-lo::after{content:'';position:absolute;inset:-5px 0;}
.btn-t:active,.btn-lo:active{transform:scale(.96);}
/* year: segmented control with a sliding thumb */
.yt{position:relative;display:flex;background:var(--fill);border-radius:9px;padding:2px;height:34px;}
.yth{position:absolute;top:2px;bottom:2px;left:2px;width:0;background:var(--thumb);border-radius:7px;box-shadow:0 3px 8px rgb(0 0 0/.12),0 1px 1px rgb(0 0 0/.04);transition:transform .3s cubic-bezier(.22,1,.36,1),width .3s cubic-bezier(.22,1,.36,1);}
.yb{position:relative;z-index:1;flex:1;min-width:56px;padding:0 10px;border:none;background:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--label);}
.yb.active{font-weight:600;}
.yb::after{content:'';position:absolute;inset:-5px 0;}
/* months: scrolling capsules */
.mn{overflow-x:auto;scrollbar-width:none;}
.mn::-webkit-scrollbar{display:none;}
.mt{display:flex;gap:6px;padding:2px max(var(--margin),env(safe-area-inset-left)) 10px;width:max-content;min-width:100%;}
@media(min-width:1472px){.mt{padding-left:calc((100vw - 1440px)/2 + var(--margin));}}
.tab{height:32px;display:flex;align-items:center;padding:0 14px;border:none;border-radius:999px;font-size:15px;font-weight:500;color:var(--label);background:var(--fill2);cursor:pointer;white-space:nowrap;position:relative;transition:background .2s,color .2s;}
.tab::after{content:'';position:absolute;inset:-6px 0;}
.tab.active{background:var(--label);color:var(--card);font-weight:600;}

/* ---- content ---- */
main{padding:16px max(var(--margin),env(safe-area-inset-left)) calc(48px + env(safe-area-inset-bottom));max-width:1440px;margin:0 auto;}
.mp{display:none;}.mp.active{display:block;}
.mtitle{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2;margin:4px 0 10px;}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:20px;align-items:center;}
.leg-ttl{display:none;}
.li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label);}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.lp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label);}
.lp::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--c);}
.ld{width:.5px;height:16px;background:var(--sep);}
.un{font-size:12px;color:var(--label2);width:100%;}
.wb{margin-bottom:24px;}
.wl{display:block;font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 4px 6px;}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:var(--r-card);}
.st{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
.dhr th{height:36px;padding:0 6px;text-align:center;font-weight:600;font-size:12px;color:var(--label2);border-bottom:.5px solid var(--sep);background:var(--card);}
.thl{text-align:left!important;white-space:nowrap;width:240px;min-width:240px;padding-left:14px!important;border-right:.5px solid var(--sep);}
.thw,.thwe,.the{min-width:72px;}
.thwe{background:var(--card2)!important;}
.thl,.tdl{position:sticky;left:0;z-index:2;}
.dr td{height:40px;padding:4px;border-bottom:.5px solid var(--sep);text-align:center;vertical-align:middle;font-size:13px;color:var(--label2);}
.dr:last-child td{border-bottom:none;}
.tdl{text-align:left!important;font-weight:600;font-size:13px;color:var(--label)!important;line-height:1.25;white-space:nowrap;background:var(--card);padding:4px 10px 4px 14px!important;border-right:.5px solid var(--sep);}
.tdl::before{content:'';display:inline-block;width:3px;height:14px;border-radius:2px;margin-right:8px;vertical-align:-2px;background:var(--c);}
.tdl.shift{--c:var(--s);}.tdl.derm{--c:var(--d);}.tdl.lodging{--c:var(--l);}
.cp{display:block;width:100%;border-radius:6px;padding:5px 4px;font-weight:600;font-size:13px;color:#1a1a2e;line-height:1.2;}
.cc{background:var(--closed-bg)!important;color:var(--closed)!important;}

@media(max-width:767px){
header{flex-wrap:wrap;row-gap:8px;}
.lm{display:none;}
.btn-t,.btn-lo{padding:0 12px;}
.hr{display:contents;}
.yt{order:3;width:100%;}
.yb{min-width:0;}
.mtitle{font-size:28px;}
.emp{display:none;}
.thl{width:130px;min-width:130px;max-width:130px;padding-left:10px!important;}
.tdl{white-space:normal;max-width:130px;font-size:12px;padding:4px 8px 4px 11px!important;box-shadow:inset 3px 0 0 var(--c);}
.tdl::before{display:none;}
.thw,.thwe,.the{min-width:68px;}
.dr td{padding:3px;}
.cp{font-size:12px;padding:5px 2px;}
}
@media(max-width:380px){.ls{display:none;}.thl,.tdl{width:108px;min-width:108px;max-width:108px;}.thw,.thwe,.the{min-width:62px;}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;}}
@media(prefers-reduced-transparency:reduce){.topbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head><body>
<div id="login-screen">
<div class="login-box">
<div class="login-logo">K</div>
<div class="login-title">Kauai Urgent Care</div>
<div class="login-sub">Provider Schedule</div>
<div class="login-input-wrap">
<input class="login-input" id="pwd-input" type="password" placeholder="Enter password" autocomplete="current-password">
<button class="toggle-pw" id="toggle-pw-btn" onclick="togglePw()" type="button" aria-label="Show password">Show</button>
</div>
<button class="login-btn" type="button" onclick="doLogin()">Sign In</button>
<div class="login-error" id="login-error" role="alert">That password didn’t match. Try again.</div>
<div class="login-footer">For Kauai Urgent Care staff</div>
</div></div>
<div id="app">
<div class="topbar"><header>
<div class="hl"><div class="lm">K</div><div class="lt">Kauai Urgent Care<span class="ls">Provider Schedule</span></div></div>
<div class="hr"><div class="yt" id="yTog" role="tablist" aria-label="Year"></div><div class="hb"><button class="btn-t" type="button" onclick="gToday()">Today</button><button class="btn-lo" type="button" onclick="doLogout()">Sign Out</button></div></div>
</header>
<nav class="mn" aria-label="Month"><div class="mt" id="mTabs"></div></nav></div>
<main>
<div class="leg">
<div class="leg-ttl">Provider Color Key</div>
<div id="legKey" style="display:contents"></div>
<div class="ld"></div>
<span class="lp" style="--c:var(--s)">Shift</span>
<span class="lp" style="--c:var(--d)">Derm</span>
<span class="lp" style="--c:var(--l)">Lodging</span>
<div class="un">Last updated: <span id="lastUpd">&hellip;</span></div>
</div>
<div id="cal"></div>
</main></div>
<script>var PWD_HASH='d98ddeb0ee0ae362ee3565c6214b212dc78fe590b92af4dc383b11922035a574';
var SESSION_KEY='kuc_auth';
async function hashPwd(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function doLogin(){
  var input=document.getElementById('pwd-input').value;
  if(!input){shake();return;}
  var hash=await hashPwd(input);
  if(hash===PWD_HASH){
    sessionStorage.setItem(SESSION_KEY,'1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    var err=document.getElementById('login-error');
    err.classList.add('show');
    document.getElementById('pwd-input').value='';
    shake();
    setTimeout(function(){err.classList.remove('show');},3000);
  }
}
function shake(){
  var box=document.querySelector('.login-box');
  box.style.animation='none';
  box.offsetHeight;
  box.style.animation='shake .4s ease';
}
function togglePw(){
  var inp=document.getElementById('pwd-input');
  var btn=document.getElementById('toggle-pw-btn');
  if(inp.type==='password'){inp.type='text';btn.textContent='Hide';btn.setAttribute('aria-label','Hide password');}
  else{inp.type='password';btn.textContent='Show';btn.setAttribute('aria-label','Show password');}
}
function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd-input').value='';
}
document.getElementById('pwd-input').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
if(sessionStorage.getItem(SESSION_KEY)==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
}
var ALL_YEARS={};var YEARS=[];var DATA_READY=false,WANT_INIT=false;
// ---- Provider colors (edit here; the sheet script's colors are ignored) ----
var KEY_PROVIDERS=[['MILEKA','Mileka','#9A7400'],['KAITLYN','Kaitlyn','#1F5FA8'],['SABRINA','Sabrina','#2F3E46'],['ROVA','Rova','#6C3483'],['ADAMS','Adams','#B03A2E']];
var MID_PROVIDERS=[['PROCTOR','#F39C12'],['GRETCHEN','#C0D84A'],['TED','#22BEB6'],['HAYES','#A0A4A8'],['SCHENFELD','#C9B458']];
var LIGHT_PROVIDERS=[['GREG','#FCD3BC'],['MORRIS','#CFE6C2'],['LOMBARDI','#EBC3EC'],['BRYANT','#F9C4D2']];
var PALETTE=['#FFBEC9','#FFC4AA','#E5D09D','#BFDAA8','#98E0C7','#85E0EB','#9BD9FF','#CACEFF','#F4C3EC','#DAD7D2'];
var NOT_PROVIDERS={DERM:1,XRAY:1,HOLD:1,END:1,HOME:1,APARTMENT:1,CLOSED:1,OTHER:1,COVERAGE:1};
var ALIASES={HAAS:'SABRINA',PROC:'PROCTOR',SUGARMAN:'SUGERMAN',JEPPESON:'JEPPESEN'};
var PCOLOR={};
function baseName(s){
  s=s.replace(/\(.*?\)/g,' ').replace(/\*/g,'').trim();
  if(!s||/^\d/.test(s))return null;
  var w=s.split(/\s+/)[0].toUpperCase().replace(/[^A-Z]/g,'');
  if(w.length<2||NOT_PROVIDERS[w])return null;
  return ALIASES[w]||w;
}
function pNames(v){
  if(!v||v.charAt(0)==='(')return [];
  return v.replace(/\bw\//gi,'/').split(/[\/|]/).map(baseName).filter(function(n){return n;});
}
function isLight(hex){var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);return (r*299+g*587+b*114)/1000>=150;}
function buildColors(){
  PCOLOR={};KEY_PROVIDERS.forEach(function(k){PCOLOR[k[0]]=k[2];});MID_PROVIDERS.concat(LIGHT_PROVIDERS).forEach(function(k){PCOLOR[k[0]]=k[1];});
  var order=[],months={};
  YEARS.forEach(function(y){ALL_YEARS[y].forEach(function(m,mi){var mk=y+'|'+mi;
    m.weeks.forEach(function(w){w.rows.forEach(function(r){r.cells.forEach(function(c){
      pNames(c.value).forEach(function(n){if(!months[n]){months[n]={};order.push(n);}months[n][mk]=1;});
    });});});});});
  var fixed={};Object.keys(PCOLOR).forEach(function(k){fixed[k]=1;});
  var mates={};
  order.forEach(function(n){mates[n]=[];order.forEach(function(o){if(o===n)return;var k=0;Object.keys(months[n]).forEach(function(mk){if(months[o][mk])k++;});if(k)mates[n].push([o,k]);});});
  // pick the muted color that clashes least, weighting people by how many months they share
  function pick(n){var best=PALETTE[0],bestP=1e18;
    PALETTE.forEach(function(c){var pen=0;mates[n].forEach(function(m){var col=PCOLOR[m[0]];if(col){var d=cdist(c,col);if(d<45)pen+=m[1]*(45-d)*(45-d)*(d<20?20:1);}});
      if(pen<bestP){bestP=pen;best=c;}});
    PCOLOR[n]=best;}
  order.forEach(function(n){if(!fixed[n])pick(n);});
  for(var pass=0;pass<4;pass++)order.forEach(function(n){if(!fixed[n])pick(n);});
}
// how different two colors look: mostly color family (hue), partly light vs dark
function lch(h){var v=[1,3,5].map(function(i){var c=parseInt(h.substr(i,2),16)/255;return c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92;});
  var x=(v[0]*0.4124+v[1]*0.3576+v[2]*0.1805)/0.95047,y=v[0]*0.2126+v[1]*0.7152+v[2]*0.0722,z=(v[0]*0.0193+v[1]*0.1192+v[2]*0.9505)/1.08883;
  function f(t){return t>0.008856?Math.cbrt(t):7.787*t+16/116;}
  var L=116*f(y)-16,A=500*(f(x)-f(y)),B=200*(f(y)-f(z));
  return [L,Math.sqrt(A*A+B*B),(Math.atan2(B,A)*180/Math.PI+360)%360];}
function cdist(a,b){var p=lch(a),q=lch(b);
  if(p[1]<10&&q[1]<10)return Math.abs(p[0]-q[0]);
  if(p[1]<10||q[1]<10)return 60;
  var dh=Math.abs(p[2]-q[2]);dh=Math.min(dh,360-dh);
  var hue=dh*Math.min(1,Math.min(p[1],q[1])/40),lt=0.8*(p[0]-q[0]);
  return Math.sqrt(hue*hue+lt*lt);}
function cellStyle(v){
  var cols=[];pNames(v).forEach(function(n){if(PCOLOR[n]&&cols.indexOf(PCOLOR[n])===-1)cols.push(PCOLOR[n]);});
  if(!cols.length)return null;
  var light=cols.every(isLight);
  var txt=light?'color:#1a1a2e;':'color:#fff;'+(cols.some(isLight)?'text-shadow:0 0 3px rgba(0,0,0,.7);':'');
  if(cols.length===1)return 'background:'+cols[0]+';'+txt;
  var stops=cols.map(function(c,i){return c+' '+(i*100/cols.length)+'% '+((i+1)*100/cols.length)+'%';}).join(',');
  return 'background:linear-gradient(90deg,'+stops+');'+txt;
}
function renderLegend(){
  document.getElementById('legKey').innerHTML=KEY_PROVIDERS.map(function(k){return '<div class="li"><div class="sw" style="background:'+k[2]+'"></div>'+k[1]+'</div>';}).join('');
}
function isW(h){return h&&(h.indexOf('Sat')!==-1||h.indexOf('Sun')!==-1);}
function bWeek(week,wi){
  var h=week.headers;
  var nums=h.filter(function(x){return x&&/^\d/.test(x);});
  var lbl=nums.length?'Week of '+nums[0].split('-')[0]+'\u2013'+nums[nums.length-1].split('-')[0]:'Week';
  var t='<section class="wb">';
  t+='<span class="wl">'+lbl+'</span>';
  t+='<div class="tw"><table class="st"><thead><tr class="dhr">';
  t+='<th class="thl">Shift</th>';
  for(var i=0;i<h.length;i++){var hdr=h[i];if(!hdr)t+='<th class="the emp"></th>';else if(isW(hdr))t+='<th class="thwe">'+hdr+'</th>';else t+='<th class="thw">'+hdr+'</th>';}
  t+='</tr></thead><tbody>';
  for(var ri=0;ri<week.rows.length;ri++){var row=week.rows[ri];
    t+='<tr class="dr"><td class="tdl '+row.type+'">'+row.label+'</td>';
    for(var ci=0;ci<h.length;ci++){var cell=row.cells[ci]||{value:'',color:null};
      if(!h[ci]&&!cell.value)t+='<td class="emp"></td>';
      else if(!cell.value)t+='<td></td>';
      else if(cell.value.toLowerCase()==='closed')t+='<td><span class="cp cc">Closed</span></td>';
      else{var cs=cellStyle(cell.value);t+=cs?'<td><span class="cp" style="'+cs+'">'+cell.value+'</span></td>':'<td>'+cell.value+'</td>';}
    }t+='</tr>';
  }
  t+='</tbody></table></div></section>';return t;
}
function mName(n){return String(n).replace(/\s*\(\d+\)\s*$/,'');}
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function mShort(n){var b=mName(n);return MONTHS.indexOf(b)>=0?b.slice(0,3):b;}
function rMonth(m,mi){
  var w=m.weeks.map(function(wk,wi){return bWeek(wk,wi);}).join('');
  return '<div class="mp" id="mp'+mi+'"><h2 class="mtitle">'+mName(m.name)+'</h2>'+w+'</div>';
}
function rYear(year){
  document.querySelectorAll('.yb').forEach(function(b){var on=b.getAttribute('data-year')===year;b.classList.toggle('active',on);b.setAttribute('aria-selected',on);});moveThumb();
  var months=ALL_YEARS[year];
  document.getElementById('mTabs').innerHTML=months.map(function(m,i){return '<button type="button" class="tab" onclick="sMonth('+i+')">'+mShort(m.name)+'</button>';}).join('');
  document.getElementById('cal').innerHTML=months.map(function(m,i){return rMonth(m,i);}).join('');
  sMonth(0);
}
function moveThumb(){var a=document.querySelector('.yb.active'),th=document.getElementById('yThumb');if(!a||!th)return;th.style.width=a.offsetWidth+'px';th.style.transform='translateX('+(a.offsetLeft-2)+'px)';th.style.left='2px';}
window.addEventListener('resize',moveThumb);
function sMonth(idx){
  document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',i===idx);if(i===idx)t.setAttribute('aria-current','true');else t.removeAttribute('aria-current');});
  document.querySelectorAll('.mp').forEach(function(p,i){p.classList.toggle('active',i===idx);});
  var tab=document.querySelectorAll('.tab')[idx];
  if(tab)tab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  window.scrollTo({top:0,behavior:'smooth'});
}
function gToday(){
  var now=new Date();var y=String(now.getFullYear());
  var yr=ALL_YEARS[y]?y:YEARS[0];rYear(yr);
  var mn=now.toLocaleString('default',{month:'long'});
  var idx=-1;ALL_YEARS[yr].forEach(function(m,i){if(mName(m.name)===mn)idx=i;});
  if(idx>=0)sMonth(idx);
}
function init(){
  if(!DATA_READY){WANT_INIT=true;return;}
  buildColors();renderLegend();
  document.getElementById('yTog').innerHTML='<span class="yth" id="yThumb" aria-hidden="true"></span>'+YEARS.map(function(y){return '<button type="button" role="tab" class="yb" data-year="'+y+'" onclick="rYear(\'' +y+ '\')">'+y+'</button>';}).join('');
  gToday();
}
fetch('schedule.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
  var yrs=d.years||d;Object.keys(yrs).forEach(function(y){yrs[y]=yrs[y].filter(function(m){return MONTHS.indexOf(mName(m.name))>=0;}).sort(function(a,b){return MONTHS.indexOf(mName(a.name))-MONTHS.indexOf(mName(b.name));});});ALL_YEARS=yrs;if(d.lastUpdated)document.getElementById('lastUpd').textContent=d.lastUpdated+' HST';YEARS=Object.keys(ALL_YEARS).sort();DATA_READY=true;
  if(WANT_INIT||sessionStorage.getItem(SESSION_KEY)==='1')init();
}).catch(function(e){document.getElementById('cal').innerHTML='<p style="padding:16px 0;color:var(--label2)">The schedule didn’t load. Check your connection, then refresh the page.</p>';});
</script>
</body></html>
